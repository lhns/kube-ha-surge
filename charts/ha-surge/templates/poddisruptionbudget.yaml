{{- if .Values.podDisruptionBudget.enabled }}
# Keeps at least one operator replica available during a node drain, so the
# eviction webhook stays up exactly when it's needed most (ADR 0010).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ha-surge.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ha-surge.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "ha-surge.selectorLabels" . | nindent 6 }}
{{- end }}
