{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ha-surge.managerRoleName" . }}
  labels:
    {{- include "ha-surge.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ha-surge.managerRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ha-surge.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
