{{- /*
Source of truth for these rules is config/rbac/role.yaml, which is generated by
`make manifests` (controller-gen) from the +kubebuilder:rbac markers on the
controllers/webhook in internal/. This template duplicates those rules verbatim
because the chart's ClusterRole uses Helm-templated (release-aware) naming that
controller-gen doesn't emit. Keep the two in sync.
*/ -}}
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ha-surge.managerRoleName" . }}
  labels:
    {{- include "ha-surge.labels" . | nindent 4 }}
rules:
  # Pods: the webhook detaches a doomed pod from its ReplicaSet (patch removes
  # pod-template-hash) and the controller deletes the detached cover once the
  # RS's own replacement is Ready.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, patch, delete]
  # PVC access modes drive the RWO / single-writer safety refusal.
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch]
  # Services: guard against a Service that selects on pod-template-hash (which
  # detaching would break) before acting.
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch]
  # Events for detach lifecycle diagnostics.
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  # Deployment (opt-in annotation, ownerRef target) + ReplicaSet (resolve the
  # pod's owning Deployment, detect the RS's own replacement becoming Ready).
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
{{- end }}
