apiVersion: v1
kind: Service
metadata:
  name: {{ include "kube-ha-surge.webhookServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-ha-surge.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: webhook
      port: 443
      targetPort: 9443
      protocol: TCP
  selector:
    {{- include "kube-ha-surge.selectorLabels" . | nindent 4 }}
