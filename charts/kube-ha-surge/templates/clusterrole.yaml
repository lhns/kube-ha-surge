{{- /*
Source of truth for these rules is config/rbac/role.yaml, which is generated by
`make manifests` (controller-gen) from the +kubebuilder:rbac markers on the
controllers/webhook in internal/. This template duplicates those rules verbatim
because the chart's ClusterRole uses Helm-templated (release-aware) naming that
controller-gen doesn't emit. Keep the two in sync.
*/ -}}
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kube-ha-surge.managerRoleName" . }}
  labels:
    {{- include "kube-ha-surge.labels" . | nindent 4 }}
rules:
  # Surge pods: the webhook clones a doomed pod into a stand-in and the
  # controller garbage-collects it.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, delete, patch]
  # PVC access modes drive the RWO / single-writer safety refusal.
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch]
  # Events for surge lifecycle diagnostics.
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  # Deployment (opt-in annotation, ownerRef target) + ReplicaSet (resolve the
  # pod's owning Deployment, detect the RS's own replacement becoming Ready).
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list, watch]
  # EndpointSlices: confirm the surge pod is actually serving before allowing
  # the eviction.
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
{{- end }}
