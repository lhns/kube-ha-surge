apiVersion: v1
kind: Namespace
metadata:
  name: ha-surge-system
  labels:
    kubernetes.io/metadata.name: ha-surge-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ha-surge-controller
  namespace: ha-surge-system
  labels:
    app.kubernetes.io/name: ha-surge
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ha-surge
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ha-surge
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: ha-surge
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/lhns/ha-surge:latest
          imagePullPolicy: IfNotPresent
          args:
            - --leader-elect
            - --max-surge-seconds=120
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
            - --webhook-port=9443
            - --webhook-cert-dir=/tmp/k8s-webhook-server/serving-certs
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - containerPort: 9443
              name: webhook
              protocol: TCP
            - containerPort: 8080
              name: metrics
              protocol: TCP
            - containerPort: 8081
              name: health
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
      volumes:
        # The serving cert is supplied out-of-band for this (non-Helm) path:
        # Helm's cert-manager/genSignedCert flow provisions this Secret. For
        # `make deploy` dev use, create it yourself (e.g. a cert-manager
        # Certificate) or run cert-manager.
        - name: webhook-certs
          secret:
            secretName: ha-surge-webhook-tls
            defaultMode: 0444
      terminationGracePeriodSeconds: 10
